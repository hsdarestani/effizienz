name: Deploy Effizienz to Strato

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: effizienz-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare production build
        run: |
          set -euo pipefail
          mkdir -p dist
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='dist/' \
            ./ dist/

          while IFS= read -r -d '' file; do
            sed -i 's#https://effizienz.pages.dev#https://es-effizienz.de#g' "$file"
          done < <(grep -rlZ 'https://effizienz.pages.dev' dist --include='*.html' --include='*.xml' --include='*.txt' || true)

          rm -f dist/_headers

          if grep -R 'https://effizienz.pages.dev' dist --include='*.html' --include='*.xml' --include='*.txt'; then
            echo 'Old Cloudflare production URLs remain in deploy output.' >&2
            exit 1
          fi

      - name: Prepare SSH transport
        env:
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          PORT="${STRATO_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$STRATO_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Bootstrap Strato server
        env:
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
          SSHPASS: ${{ secrets.STRATO_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STRATO_PORT:-22}"
          sshpass -e ssh -p "$PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            "root@$STRATO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y nginx rsync curl ca-certificates certbot python3-certbot-nginx

          install -d -m 755 -o root -g www-data /var/www/effizienz

          cat > /etc/nginx/sites-available/effizienz <<'NGINX'
          server {
              listen 80;
              listen [::]:80;
              server_name es-effizienz.de www.es-effizienz.de;

              root /var/www/effizienz;
              index index.html;

              location / {
                  try_files $uri $uri/ $uri/index.html =404;
              }

              location ~ /\.git {
                  deny all;
              }

              add_header X-Content-Type-Options "nosniff" always;
              add_header Referrer-Policy "strict-origin-when-cross-origin" always;
              add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
              add_header X-Frame-Options "SAMEORIGIN" always;
              add_header Content-Security-Policy "default-src 'self' data:; img-src 'self' data: https://images.unsplash.com https://images.pexels.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; form-action 'self' mailto:; base-uri 'self'; frame-ancestors 'self'" always;

              client_max_body_size 10m;
          }
          NGINX

          ln -sfn /etc/nginx/sites-available/effizienz /etc/nginx/sites-enabled/effizienz
          rm -f /etc/nginx/sites-enabled/default

          nginx -t
          systemctl enable nginx
          systemctl restart nginx
          REMOTE

      - name: Deploy site files
        env:
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
          SSHPASS: ${{ secrets.STRATO_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STRATO_PORT:-22}"
          sshpass -e rsync -az --delete \
            -e "ssh -p $PORT -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes" \
            dist/ "root@$STRATO_HOST:/var/www/effizienz/"

      - name: Configure HTTPS and verify server
        env:
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
          SSHPASS: ${{ secrets.STRATO_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STRATO_PORT:-22}"
          sshpass -e ssh -p "$PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            "root@$STRATO_HOST" "STRATO_HOST='$STRATO_HOST' bash -s" <<'REMOTE'
          set -euo pipefail

          nginx -t
          systemctl reload nginx

          APEX_IP="$(getent ahostsv4 es-effizienz.de | awk 'NR==1 {print $1}' || true)"
          WWW_IP="$(getent ahostsv4 www.es-effizienz.de | awk 'NR==1 {print $1}' || true)"

          if [ "$APEX_IP" = "$STRATO_HOST" ]; then
            DOMAINS=(-d es-effizienz.de)
            if [ "$WWW_IP" = "$STRATO_HOST" ]; then
              DOMAINS+=(-d www.es-effizienz.de)
            fi

            certbot --nginx \
              --non-interactive \
              --agree-tos \
              --register-unsafely-without-email \
              --redirect \
              "${DOMAINS[@]}" || echo 'HTTPS provisioning is pending; HTTP deployment remains available.'
          else
            echo "DNS is not on the Strato server yet (apex IPv4: ${APEX_IP:-none}). SSL will be retried on the next deployment."
          fi

          curl -fsS -H 'Host: es-effizienz.de' http://127.0.0.1/ >/dev/null
          REMOTE

      - name: Production smoke tests
        env:
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
        run: |
          set -euo pipefail
          for path in / /leistungen/ /hausmeisterservice/ /abriss-entruempelung/ /winterdienst/ /umzug/ /garten-landschaftsbau/ /ueber-uns/ /referenzen/ /faq/ /kontakt/ /impressum/ /datenschutz/; do
            curl -fsS --resolve "es-effizienz.de:80:$STRATO_HOST" "http://es-effizienz.de${path}" >/dev/null
          done
          echo 'Effizienz production deployment passed all smoke tests.'
