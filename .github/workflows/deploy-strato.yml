name: Deploy Effizienz to Strato

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: effizienz-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare production build
        run: |
          set -euo pipefail
          mkdir -p dist
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='dist/' \
            --exclude='server/' \
            ./ dist/

          while IFS= read -r -d '' file; do
            sed -i 's#https://effizienz.pages.dev#https://es-effizienz.de#g' "$file"
          done < <(grep -rlZ 'https://effizienz.pages.dev' dist --include='*.html' --include='*.xml' --include='*.txt' --include='*.js' || true)

          rm -f dist/_headers

          if grep -R 'https://effizienz.pages.dev' dist --include='*.html' --include='*.xml' --include='*.txt' --include='*.js'; then
            echo 'Old Cloudflare production URLs remain in deploy output.' >&2
            exit 1
          fi

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_KEY }}
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

          python3 - <<'PY'
          import os
          from pathlib import Path

          key = os.environ['SSH_PRIVATE_KEY'].strip().replace('\r', '')
          if '\\n' in key and '\n' not in key:
              key = key.replace('\\n', '\n')
          Path.home().joinpath('.ssh/effizienz_strato').write_text(key + '\n')
          PY

          chmod 600 ~/.ssh/effizienz_strato
          ssh-keygen -y -f ~/.ssh/effizienz_strato > ~/.ssh/effizienz_strato.pub

          PORT="${STRATO_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$STRATO_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/effizienz_strato -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "root@$STRATO_HOST" 'echo SSH key authentication OK'

      - name: Bootstrap Strato server and contact mail service
        env:
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${STRATO_PORT:-22}"

          scp -i ~/.ssh/effizienz_strato -P "$PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            ~/.ssh/effizienz_strato.pub "root@$STRATO_HOST:/tmp/effizienz-deploy.pub"

          scp -i ~/.ssh/effizienz_strato -P "$PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            server/contact_api.py "root@$STRATO_HOST:/tmp/contact_api.py"

          if [ -n "${SMTP_USER:-}" ] && [ -n "${SMTP_PASSWORD:-}" ]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = {
              'smtp_host': 'smtps.udag.de',
              'smtp_port': 465,
              'smtp_user': os.environ['SMTP_USER'],
              'smtp_password': os.environ['SMTP_PASSWORD'],
              'mail_from': os.environ['SMTP_USER'],
              'mail_to': 'info@es-effizienz.de',
          }
          Path('/tmp/effizienz-mail.json').write_text(json.dumps(config), encoding='utf-8')
          PY
            chmod 600 /tmp/effizienz-mail.json
            scp -i ~/.ssh/effizienz_strato -P "$PORT" \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              /tmp/effizienz-mail.json "root@$STRATO_HOST:/tmp/effizienz-mail.json"
            rm -f /tmp/effizienz-mail.json
          else
            echo 'SMTP_USER / SMTP_PASSWORD are not configured yet. Website will deploy, but server-side mail remains inactive.'
          fi

          ssh -i ~/.ssh/effizienz_strato -p "$PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "root@$STRATO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y nginx rsync curl ca-certificates certbot python3 python3-certbot-nginx

          if ! id deploy >/dev/null 2>&1; then
            useradd --create-home --shell /bin/bash deploy
          fi

          install -d -m 700 -o deploy -g deploy /home/deploy/.ssh
          install -m 600 -o deploy -g deploy /tmp/effizienz-deploy.pub /home/deploy/.ssh/authorized_keys
          rm -f /tmp/effizienz-deploy.pub

          install -d -m 755 -o deploy -g www-data /var/www/effizienz
          chown -R deploy:www-data /var/www/effizienz

          if ! id effizienz-mail >/dev/null 2>&1; then
            useradd --system --home /opt/effizienz-mail --shell /usr/sbin/nologin effizienz-mail
          fi
          install -d -m 755 -o root -g root /opt/effizienz-mail
          install -m 755 -o root -g root /tmp/contact_api.py /opt/effizienz-mail/contact_api.py
          rm -f /tmp/contact_api.py

          if [ -f /tmp/effizienz-mail.json ]; then
            install -m 640 -o root -g effizienz-mail /tmp/effizienz-mail.json /etc/effizienz-mail.json
            rm -f /tmp/effizienz-mail.json
          fi

          cat > /etc/systemd/system/effizienz-mail.service <<'SERVICE'
          [Unit]
          Description=ES Effizienz contact form mail service
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=effizienz-mail
          Group=effizienz-mail
          WorkingDirectory=/opt/effizienz-mail
          ExecStart=/usr/bin/python3 /opt/effizienz-mail/contact_api.py
          Restart=on-failure
          RestartSec=3
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ProtectHome=true
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectControlGroups=true
          RestrictAddressFamilies=AF_INET AF_INET6

          [Install]
          WantedBy=multi-user.target
          SERVICE

          cat > /etc/nginx/sites-available/effizienz <<'NGINX'
          server {
              listen 80;
              listen [::]:80;
              server_name es-effizienz.de www.es-effizienz.de;

              root /var/www/effizienz;
              index index.html;

              location ^~ /api/contact/ {
                  proxy_pass http://127.0.0.1:8765/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_connect_timeout 5s;
                  proxy_read_timeout 30s;
                  proxy_send_timeout 30s;
              }

              location / {
                  try_files $uri $uri/ $uri/index.html =404;
              }

              location ~ /\.git {
                  deny all;
              }

              add_header X-Content-Type-Options "nosniff" always;
              add_header Referrer-Policy "strict-origin-when-cross-origin" always;
              add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
              add_header X-Frame-Options "SAMEORIGIN" always;
              add_header Content-Security-Policy "default-src 'self' data:; img-src 'self' data: https://images.unsplash.com https://images.pexels.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; form-action 'self' mailto:; base-uri 'self'; frame-ancestors 'self'" always;

              client_max_body_size 10m;
          }
          NGINX

          ln -sfn /etc/nginx/sites-available/effizienz /etc/nginx/sites-enabled/effizienz
          rm -f /etc/nginx/sites-enabled/default

          systemctl daemon-reload
          if [ -f /etc/effizienz-mail.json ]; then
            systemctl enable effizienz-mail
            systemctl restart effizienz-mail
            sleep 1
            curl -fsS http://127.0.0.1:8765/health >/dev/null
          fi

          nginx -t
          systemctl enable nginx
          systemctl restart nginx
          REMOTE

      - name: Deploy site files
        env:
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
        run: |
          set -euo pipefail
          PORT="${STRATO_PORT:-22}"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/effizienz_strato -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            dist/ "deploy@$STRATO_HOST:/var/www/effizienz/"

      - name: Configure HTTPS and verify server
        env:
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_PORT: ${{ secrets.STRATO_PORT }}
        run: |
          set -euo pipefail
          PORT="${STRATO_PORT:-22}"

          ssh -i ~/.ssh/effizienz_strato -p "$PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "root@$STRATO_HOST" "STRATO_HOST='$STRATO_HOST' bash -s" <<'REMOTE'
          set -euo pipefail

          nginx -t
          systemctl reload nginx

          APEX_IP="$(getent ahostsv4 es-effizienz.de | awk 'NR==1 {print $1}' || true)"
          WWW_IP="$(getent ahostsv4 www.es-effizienz.de | awk 'NR==1 {print $1}' || true)"

          echo "Apex IPv4: ${APEX_IP:-none}"
          echo "WWW IPv4: ${WWW_IP:-none}"

          if [ "$APEX_IP" = "$STRATO_HOST" ]; then
            DOMAINS=(-d es-effizienz.de)
            if [ "$WWW_IP" = "$STRATO_HOST" ]; then
              DOMAINS+=(-d www.es-effizienz.de)
            fi

            certbot --nginx \
              --non-interactive \
              --agree-tos \
              --register-unsafely-without-email \
              --redirect \
              "${DOMAINS[@]}"
          else
            echo "DNS is not on this Strato server yet. HTTP is deployed; SSL will be retried on the next deployment."
          fi

          curl -fsS -H 'Host: es-effizienz.de' http://127.0.0.1/ >/dev/null || \
            curl -kfsS -H 'Host: es-effizienz.de' https://127.0.0.1/ >/dev/null
          REMOTE

      - name: Production smoke tests
        env:
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          set -euo pipefail

          for path in / /leistungen/ /hausmeisterservice/ /abriss-entruempelung/ /winterdienst/ /umzug/ /garten-landschaftsbau/ /ueber-uns/ /referenzen/ /faq/ /kontakt/ /impressum/ /datenschutz/; do
            curl -fsS --resolve "es-effizienz.de:80:$STRATO_HOST" "http://es-effizienz.de${path}" >/dev/null || \
            curl -kfsS --resolve "es-effizienz.de:443:$STRATO_HOST" "https://es-effizienz.de${path}" >/dev/null
          done

          if [ -n "${SMTP_USER:-}" ] && [ -n "${SMTP_PASSWORD:-}" ]; then
            curl -kfsS --resolve "es-effizienz.de:443:$STRATO_HOST" "https://es-effizienz.de/api/contact/health" >/dev/null
          fi

          echo 'Effizienz production deployment passed all smoke tests.'
