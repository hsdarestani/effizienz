name: Prevent emoji arrows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure northeast arrow emoji is not used in UI source
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.html' --include='*.js' $'\u2197' . --exclude-dir=.git; then
            echo 'Do not use U+2197 in UI copy because iOS may render it as an emoji.' >&2
            exit 1
          fi
          echo 'No iOS emoji-style arrows found.'
