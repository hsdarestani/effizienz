name: Remove emoji arrows once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-emoji-arrows-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove emoji-style northeast arrows everywhere
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in {'.html', '.js'}:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace(' ↗️', '').replace(' ↗', '')
              text = text.replace('↗️', '').replace('↗', '')
              text = re.sub(r'<span\s+class=["\']arrow["\']>\s*</span>', '', text)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for item in changed:
              print(' -', item)
          PY

          rm -f .github/workflows/remove-emoji-arrows-once.yml

      - name: Commit cleanup
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Remove emoji arrows across site'
          git push origin HEAD:main
